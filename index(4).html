<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0e12">
  <meta name="description" content="Shokhzod Ergashev. Mostly backend. Sometimes everything else.">
  <title>Shokhzod Ergashev — Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:dark; --bg:#0c0e12; --fg:#f4f4f1; --muted:#888e9b; --line:#2b3039; --accent:#aebdff; --panel:#14171d; --grid:rgba(152,162,186,.075); --glow:rgba(144,160,235,.11); --x:50%; --y:40%; }
    html[data-theme="light"] { color-scheme:light; --bg:#f4f3ef; --fg:#191c22; --muted:#666d79; --line:#d8d9da; --accent:#4658b1; --panel:#eaeae7; --grid:rgba(55,65,86,.075); --glow:rgba(104,120,204,.09); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; font-family:Manrope,system-ui,sans-serif; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; transition:background .35s,color .35s; }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; }
    a:focus-visible,button:focus-visible { outline:2px solid var(--accent); outline-offset:5px; }
    .atmosphere { position:fixed; inset:0; z-index:0; pointer-events:none; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(circle 320px at var(--x) var(--y),var(--glow),transparent 80%); background-size:64px 64px,64px 64px,auto; mask-image:linear-gradient(to bottom,black,transparent 94%); }
    .shell { position:relative; z-index:1; max-width:1480px; min-height:100vh; margin:auto; padding:32px clamp(24px,6vw,100px) 30px; display:flex; flex-direction:column; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .brand { font-size:18px; font-weight:800; letter-spacing:-.075em; }
    .brand b { color:var(--accent); }
    .top-right { display:flex; align-items:center; gap:20px; }
    .clock { display:flex; align-items:center; gap:9px; color:var(--muted); font:11px 'DM Mono',monospace; white-space:nowrap; }
    .pulse { width:6px; height:6px; border-radius:50%; background:#83c6a6; box-shadow:0 0 12px #83c6a655; }
    .theme-toggle { cursor:pointer; padding:9px 12px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--fg); font:10px 'DM Mono',monospace; letter-spacing:.08em; transition:border-color .2s,transform .2s; }
    .theme-toggle:hover { border-color:var(--accent); transform:translateY(-1px); }
    .hero { flex:1; display:flex; flex-direction:column; justify-content:center; padding:110px 0 105px; }
    .eyebrow,.utility { font:11px/1.7 'DM Mono',monospace; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
    .eyebrow { display:flex; align-items:center; gap:15px; margin-bottom:35px; }
    .eyebrow::before { content:''; width:30px; height:1px; background:var(--accent); }
    .hero-title { margin:0; font-size:clamp(64px,10.8vw,154px); font-weight:800; line-height:.93; letter-spacing:-.098em; }
    .hero-title .surname { color:var(--muted); }
    .statement { margin:42px 0 0; font-size:clamp(21px,2.7vw,34px); line-height:1.35; font-weight:600; letter-spacing:-.055em; }
    .statement span { color:var(--accent); }
    .hero-bottom { display:flex; justify-content:space-between; align-items:end; flex-wrap:wrap; gap:30px; margin-top:95px; }
    .small-stack { margin-top:13px; font:12px/2 'DM Mono',monospace; color:var(--fg); }
    .small-stack span { color:var(--muted); margin:0 10px; }
    .section-heading { margin:0; font:11px 'DM Mono',monospace; letter-spacing:.07em; color:var(--muted); }
    .contact-section { border-top:1px solid var(--line); padding:35px 0 56px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:25px; }
    .contact-links { display:flex; gap:35px; flex-wrap:wrap; }
    .contact-links a { font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:8px; transition:color .2s; }
    .contact-links a:hover { color:var(--accent); }
    .contact-links a span { font-size:16px; }
    footer { border-top:1px solid var(--line); padding-top:20px; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; }
    @media (hover:hover) and (pointer:fine) { body.cursor-enhanced,body.cursor-enhanced a,body.cursor-enhanced button { cursor:none; } .cursor { display:block; pointer-events:none; position:fixed; z-index:5; width:9px; height:9px; left:0; top:0; border-radius:50%; background:var(--accent); transform:translate(-50%,-50%); opacity:0; transition:width .2s,height .2s,opacity .15s; } .cursor.active { width:28px; height:28px; background:transparent; border:1px solid var(--accent); } }
    @media (max-width:700px) { .shell { padding:25px 24px 28px; } .clock { font-size:10px; } .clock .tz { display:none; } .top-right { gap:12px; } .hero { padding:115px 0 95px; } .hero-title { font-size:clamp(57px,14vw,100px); } .statement { margin-top:35px; } .hero-bottom { margin-top:65px; } .contact-section { align-items:start; } .contact-links { gap:23px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; scroll-behavior:auto!important; transition:none!important; } }
    @media (prefers-reduced-motion:no-preference) { .hero > * { animation:enter .65s both; } .hero > :nth-child(2) { animation-delay:.06s; } .hero > :nth-child(3) { animation-delay:.13s; } .hero > :nth-child(4) { animation-delay:.2s; } @keyframes enter { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } } }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div><div class="cursor" id="cursor" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <a href="#home" class="brand" aria-label="Go to top">shokha<b>.</b></a>
      <div class="top-right">
        <div class="clock"><span class="pulse"></span><time id="moscow-clock" aria-label="Current Moscow time">--:--:--</time><span class="tz">MSK / UTC+3</span></div>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch color theme" aria-pressed="false">LIGHT ↗</button>
      </div>
    </header>
    <main id="home">
      <section class="hero" aria-label="Introduction">
        <div class="eyebrow">Independent developer · 18 · Moscow</div>
        <h1 class="hero-title">Shokhzod<br><span class="surname">Ergashev.</span></h1>
        <p class="statement">Mostly <span>backend.</span><br>Sometimes everything else.</p>
        <div class="hero-bottom">
          <div><div class="utility">Working with</div><div class="small-stack">Python<span>/</span>Go<span>/</span>Dart<span>/</span>Linux</div></div>
        </div>
      </section>
      <section class="contact-section" id="contact" aria-label="Contact">
        <div class="section-heading">FIND ME ELSEWHERE</div>
        <nav class="contact-links" aria-label="Social links">
          <a href="https://github.com/the-shokha" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
          <a href="https://t.me/thisisshokha372" target="_blank" rel="noopener noreferrer">Telegram <span aria-hidden="true">↗</span></a>
          <a href="mailto:shokh6043@gmail.com">Email <span aria-hidden="true">↗</span></a>
        </nav>
      </section>
    </main>
    <footer><span class="utility">© <span id="year">2026</span> Shokhzod Ergashev</span><span class="utility">Made for the web.</span></footer>
  </div>
  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const saved = (() => { try { return localStorage.getItem('shokha-theme'); } catch { return null; } })();
      function setTheme(theme) {
        root.dataset.theme = theme;
        toggle.textContent = theme === 'dark' ? 'LIGHT ↗' : 'DARK ↗';
        toggle.setAttribute('aria-pressed', String(theme === 'light'));
        themeMeta.setAttribute('content', theme === 'dark' ? '#0c0e12' : '#f4f3ef');
        try { localStorage.setItem('shokha-theme', theme); } catch {}
      }
      setTheme(saved === 'light' || saved === 'dark' ? saved : 'dark');
      toggle.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
      const clock = document.getElementById('moscow-clock');
      const formatter = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
      function tick() { clock.textContent = formatter.format(new Date()); }
      tick(); setInterval(tick, 1000);
      document.getElementById('year').textContent = new Date().getFullYear();
      const pointer = window.matchMedia('(hover:hover) and (pointer:fine)');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (pointer.matches && !reduced.matches) {
        const cursor = document.getElementById('cursor');
        let seen = false;
        document.addEventListener('pointermove', (event) => {
          if (!seen) { seen = true; document.body.classList.add('cursor-enhanced'); cursor.style.opacity = '1'; }
          cursor.style.left = event.clientX + 'px'; cursor.style.top = event.clientY + 'px';
          root.style.setProperty('--x', event.clientX + 'px');
          root.style.setProperty('--y', event.clientY + 'px');
          cursor.classList.toggle('active', Boolean(event.target.closest('a,button')));
        }, {passive:true});
        document.addEventListener('pointerout', (event) => { if (!event.relatedTarget) cursor.style.opacity='0'; });
        document.addEventListener('pointerover', () => { if (seen) cursor.style.opacity='1'; });
      }
    })();
  </script>
</body>
</html>
